<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Diploma Interactive Prototype — Phase 3E</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; font: 12px/1.45 Inter, system-ui, sans-serif; background: var(--figma-color-bg, #fff); color: var(--figma-color-text, #222); }
    main { padding: 18px; }
    h1 { font-size: 16px; margin: 0 0 6px; }
    p { color: var(--figma-color-text-secondary, #666); margin: 0 0 16px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
    button { font: inherit; padding: 9px 10px; text-align: left; border: 1px solid var(--figma-color-border, #aaa); border-radius: 5px; background: var(--figma-color-bg-secondary, #f4f4f4); color: inherit; cursor: pointer; }
    button:hover { background: var(--figma-color-bg-hover, #e7e7e7); }
    button:disabled { opacity: .5; cursor: default; }
    .wide { grid-column: 1 / -1; }
    .primary { background: var(--figma-color-bg-brand, #155ed4); color: var(--figma-color-text-onbrand, #fff); }
    #report { white-space: pre-wrap; overflow: auto; height: 250px; margin: 15px 0 0; padding: 12px; border: 1px solid var(--figma-color-border, #ccc); border-radius: 5px; user-select: text; }
  </style>
</head>
<body>
  <main>
    <h1>Phase 3E · Interactive Prototype</h1>
    <p>03D is read-only. Build one flow at a time in 03E. A failed preflight leaves the previous flow intact.</p>
    <div class="grid">
      <button data-type="inspect-sources">Inspect 03D Sources</button>
      <button data-type="inspect-api">Inspect Prototype API</button>
      <button data-flow="1">Build Flow 1 — Product Availability</button>
      <button data-flow="2">Build Flow 2 — Purchase Success</button>
      <button data-flow="3">Build Flow 3 — Reservation Failure</button>
      <button data-flow="4">Build Flow 4 — Support → Sales Handoff</button>
      <button data-flow="5">Build Flow 5 — OUTCOME_UNKNOWN → Escalation</button>
      <button data-flow="6">Build Flow 6 — Human Decision / Resume TARGET</button>
      <button data-flow="7">Build Flow 7 — Analytics → Forecasts</button>
      <button data-flow="8">Build Flow 8 — Customer Web Chat</button>
      <button class="primary" data-type="validate">Validate Prototype</button>
      <button data-type="copy-report">Copy Validation Report</button>
    </div>
    <div id="report" role="status" aria-live="polite">Ready. Inspect 03D sources and the prototype API before building.</div>
  </main>
  <script>
    const report = document.getElementById('report');
    const buttons = [...document.querySelectorAll('button')];
    buttons.forEach(button => button.addEventListener('click', () => {
      const id = button.dataset.flow;
      parent.postMessage({ pluginMessage: id ? { type: 'build-flow', id: Number(id) } : { type: button.dataset.type } }, '*');
    }));
    async function copy(text) {
      try { await navigator.clipboard.writeText(text); report.textContent = 'Validation report copied to clipboard.\n\n' + text; }
      catch (error) { report.textContent = 'Clipboard unavailable. Select and copy the report below manually.\n\n' + text; }
    }
    window.onmessage = event => {
      const message = event.data.pluginMessage;
      if (!message) return;
      if (message.type === 'busy') buttons.forEach(button => button.disabled = message.value);
      if (message.type === 'report') report.textContent = message.text;
      if (message.type === 'copy') copy(message.text);
    };
  </script>
</body>
</html>
