services:
  postgres:
    image: pgvector/pgvector:0.8.1-pg17@sha256:3e8b3adfd27b5707128f60956f62a793c3c9326ea8cfaf0eab7adccb5d700b21
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_MIGRATOR_USER:?POSTGRES_MIGRATOR_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_MIGRATOR_PASSWORD:?POSTGRES_MIGRATOR_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [data]
    restart: unless-stopped

  redis:
    image: redis:8.2.1-alpine@sha256:987c376c727652f99625c7d205a1cba3cb2c53b92b0b62aade2bd48ee1593232
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - redis-data:/data
    networks: [data]
    restart: unless-stopped

  minio:
    image: cgr.dev/chainguard/minio:latest-dev@sha256:c79eec487f2de16a5513d4106e976b8d0d2fc5a87b6c0374cee9fb801a33738f
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - minio-data:/data
    networks: [data]
    restart: unless-stopped

  object-init:
    image: cgr.dev/chainguard/minio-client:latest@sha256:b2bd7824d23d3e3b15bedd7e87fbc3be29d2e213307b4f901e4a1d92356dc20f
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_APP_BUCKET: ${MINIO_APP_BUCKET:?MINIO_APP_BUCKET is required}
      MC_HOST_local: http://${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}:${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}@minio:9000
    command: ["mb", "--ignore-existing", "local/${MINIO_APP_BUCKET:?MINIO_APP_BUCKET is required}"]
    networks: [data]
    restart: "no"

  object-policy-init:
    image: cgr.dev/chainguard/minio-client:latest@sha256:b2bd7824d23d3e3b15bedd7e87fbc3be29d2e213307b4f901e4a1d92356dc20f
    depends_on:
      object-init:
        condition: service_completed_successfully
    environment:
      MC_HOST_local: http://${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}:${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}@minio:9000
    command: ["admin", "policy", "create", "local", "rag-app", "/policy.json"]
    volumes:
      - ../../infra/minio/app-policy.json:/policy.json:ro
    networks: [data]
    restart: "no"

  object-user-init:
    image: cgr.dev/chainguard/minio-client:latest@sha256:b2bd7824d23d3e3b15bedd7e87fbc3be29d2e213307b4f901e4a1d92356dc20f
    depends_on:
      object-policy-init:
        condition: service_completed_successfully
    environment:
      MC_HOST_local: http://${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}:${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}@minio:9000
    command: ["admin", "user", "add", "local", "${MINIO_APP_USER:?MINIO_APP_USER is required}", "${MINIO_APP_PASSWORD:?MINIO_APP_PASSWORD is required}"]
    networks: [data]
    restart: "no"

  object-attach-init:
    image: cgr.dev/chainguard/minio-client:latest@sha256:b2bd7824d23d3e3b15bedd7e87fbc3be29d2e213307b4f901e4a1d92356dc20f
    depends_on:
      object-user-init:
        condition: service_completed_successfully
    environment:
      MC_HOST_local: http://${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}:${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}@minio:9000
    command: ["admin", "policy", "attach", "local", "rag-app", "--user", "${MINIO_APP_USER:?MINIO_APP_USER is required}"]
    networks: [data]
    restart: "no"

  keycloak-db:
    image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?KEYCLOAK_DB_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - keycloak-data:/var/lib/postgresql/data
    networks: [identity]
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.3.3@sha256:6a7217a100bd3e5de4063a27a538ef999a3c5a88c4b4ec0ffc0a642aee7b2597
    command: ["start-dev", "--health-enabled=true"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:?KEYCLOAK_ADMIN is required}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD is required}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?KEYCLOAK_DB_PASSWORD is required}
    depends_on:
      keycloak-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3; grep -q '200 OK' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8080}:8080"
    networks: [edge, identity]
    restart: unless-stopped

  migration:
    build:
      context: ../..
      dockerfile: services/backend/Dockerfile
      target: runtime
    environment:
      MIGRATOR_DATABASE_URL: postgresql://${POSTGRES_MIGRATOR_USER:?POSTGRES_MIGRATOR_USER is required}:${POSTGRES_MIGRATOR_PASSWORD:?POSTGRES_MIGRATOR_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_MIGRATOR_USER: ${POSTGRES_MIGRATOR_USER:?POSTGRES_MIGRATOR_USER is required}
      POSTGRES_MIGRATOR_PASSWORD: ${POSTGRES_MIGRATOR_PASSWORD:?POSTGRES_MIGRATOR_PASSWORD is required}
      POSTGRES_RUNTIME_USER: ${POSTGRES_RUNTIME_USER:?POSTGRES_RUNTIME_USER is required}
      POSTGRES_RUNTIME_PASSWORD: ${POSTGRES_RUNTIME_PASSWORD:?POSTGRES_RUNTIME_PASSWORD is required}
    command: ["sh", "-ec", "python -m platform_backend.infrastructure.bootstrap && alembic -c infra/migrations/alembic.ini upgrade head"]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [data]
    restart: "no"

  backend:
    build:
      context: ../..
      dockerfile: services/backend/Dockerfile
      target: runtime
    environment:
      DATABASE_URL: postgresql://${POSTGRES_RUNTIME_USER:?POSTGRES_RUNTIME_USER is required}:${POSTGRES_RUNTIME_PASSWORD:?POSTGRES_RUNTIME_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      MINIO_ENDPOINT: minio:9000
      MINIO_APP_USER: ${MINIO_APP_USER:?MINIO_APP_USER is required}
      MINIO_APP_PASSWORD: ${MINIO_APP_PASSWORD:?MINIO_APP_PASSWORD is required}
      MINIO_APP_BUCKET: ${MINIO_APP_BUCKET:?MINIO_APP_BUCKET is required}
    depends_on:
      migration:
        condition: service_completed_successfully
      object-attach-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 12
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    networks: [edge, data, identity]
    restart: unless-stopped

  db-tests:
    profiles: [test]
    build:
      context: ../..
      dockerfile: services/backend/Dockerfile
      target: test
    environment:
      KEYCLOAK_SMOKE_ADMIN_USER: ${KEYCLOAK_ADMIN:?KEYCLOAK_ADMIN is required}
      KEYCLOAK_SMOKE_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD is required}
      MIGRATOR_DATABASE_URL: postgresql://${POSTGRES_MIGRATOR_USER:?POSTGRES_MIGRATOR_USER is required}:${POSTGRES_MIGRATOR_PASSWORD:?POSTGRES_MIGRATOR_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      DATABASE_URL: postgresql://${POSTGRES_RUNTIME_USER:?POSTGRES_RUNTIME_USER is required}:${POSTGRES_RUNTIME_PASSWORD:?POSTGRES_RUNTIME_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_RUNTIME_USER: ${POSTGRES_RUNTIME_USER:?POSTGRES_RUNTIME_USER is required}
      MINIO_ENDPOINT: minio:9000
      MINIO_APP_USER: ${MINIO_APP_USER:?MINIO_APP_USER is required}
      MINIO_APP_PASSWORD: ${MINIO_APP_PASSWORD:?MINIO_APP_PASSWORD is required}
      MINIO_APP_BUCKET: ${MINIO_APP_BUCKET:?MINIO_APP_BUCKET is required}
    depends_on:
      migration:
        condition: service_completed_successfully
      object-attach-init:
        condition: service_completed_successfully
    networks: [data, identity]
    restart: "no"

  real-llm-tests:
    profiles: [llm-test]
    build:
      context: ../..
      dockerfile: services/backend/Dockerfile
      target: test
    env_file: ../../.env
    environment:
      DEV_LLM_PROVIDER: ${DEV_LLM_PROVIDER:-gemini}
      DEV_LLM_MODEL: ${DEV_LLM_MODEL:-gemini-3.8-flash}
      MIGRATOR_DATABASE_URL: postgresql://${POSTGRES_MIGRATOR_USER:?POSTGRES_MIGRATOR_USER is required}:${POSTGRES_MIGRATOR_PASSWORD:?POSTGRES_MIGRATOR_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      DATABASE_URL: postgresql://${POSTGRES_RUNTIME_USER:?POSTGRES_RUNTIME_USER is required}:${POSTGRES_RUNTIME_PASSWORD:?POSTGRES_RUNTIME_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
    depends_on:
      migration:
        condition: service_completed_successfully
    networks: [edge, data]
    restart: "no"

networks:
  edge: {}
  data:
    internal: true
  identity:
    internal: true

volumes:
  postgres-data: {}
  redis-data: {}
  minio-data: {}
  keycloak-data: {}

